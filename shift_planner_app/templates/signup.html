{% extends "base.html" %}{% block content %}<div class="card" style="max-width:520px;margin:35px auto"><h1>オペレーター新規登録</h1><p class="muted">登録後、管理者の承認が必要です。管理者権限は申請できません。</p><form method="post"><label class="field">氏名<input name="name" maxlength="100" required></label><label class="field">ログインID<input name="username" pattern="[A-Za-z0-9_.-]{3,32}" required></label><label class="field">パスワード（8〜16文字・3種類以上）<input type="password" id="pw" name="password" minlength="8" maxlength="16" required></label><label class="field">確認用パスワード<input type="password" name="confirm_password" minlength="8" maxlength="16" required></label><label><input type="checkbox" onchange="document.getElementById('pw').type=this.checked?'text':'password'">パスワードを表示</label><p>対応スキル：{% for skill in ['consumer','merchant','PP'] %}<label><input type="checkbox" name="skills" value="{{skill}}" {% if skill=='consumer' %}checked{% endif %}>{{skill}}</label>{% endfor %}</p><button>登録を申請</button> <a href="/login">ログインへ戻る</a></form></div>{% endblock %}
